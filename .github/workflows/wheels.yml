name: wheels
# Builds the sdist and one wheel per platform. Each platform wheel bundles gazetteer-gohelper and gopls for
# that platform (cross-compiled, statically linked). This workflow only builds and smoke-tests; publishing
# is a separate, deliberate step.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz
  wheel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # the binaries are static, so the same wheel serves glibc and musl
          - {name: linux-x86_64, target: linux/amd64, platform: manylinux_2_17_x86_64.musllinux_1_2_x86_64}
          - {name: linux-aarch64, target: linux/arm64, platform: manylinux_2_17_aarch64.musllinux_1_2_aarch64}
          - {name: macos-x86_64, target: darwin/amd64, platform: macosx_12_0_x86_64}
          - {name: macos-arm64, target: darwin/arm64, platform: macosx_12_0_arm64}
          - {name: windows-x86_64, target: windows/amd64, platform: win_amd64}
          - {name: windows-arm64, target: windows/arm64, platform: win_arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/gopls/go.mod
          cache-dependency-path: |
            go/helper/go.mod
            go/gopls/go.sum
      - run: pip install build
      - run: python -m build --wheel
        env:
          GAZETTEER_GO_TARGET: ${{ matrix.target }}
          GAZETTEER_WHEEL_PLATFORM: ${{ matrix.platform }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
  smoke:
    needs: wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-linux-x86_64
          path: dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # gopls needs the go command to load packages; the runner image has one
      - run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd "$RUNNER_TEMP"   # away from the checkout: only the installed wheel can supply the tools
          /tmp/venv/bin/gazetteer build "$GITHUB_WORKSPACE/tests/fixtures/gosample" --lang go --out out
          /tmp/venv/bin/python - <<'PY'
          import json
          d = json.load(open("out/data.json"))
          clamp = d["symbols"]["engine/clamp.Clamp"]
          assert clamp["calls_in"] == ["engine/engine.Engine.Step"], clamp["calls_in"]
          assert clamp["tests"], clamp["tests"]
          PY
