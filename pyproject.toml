[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gazetteer"
version = "0.1.0"
description = "Static code docs generator for Python and Go repositories and monorepos: call graph, tests, docs links and git history in one searchable HTML page."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
lsp = ["pyright>=1.1.380"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
gazetteer = "gazetteer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gazetteer"]
# the Go tools are written by the build hook and are not in git
artifacts = ["src/gazetteer/_bin/**"]

[tool.hatch.build.targets.sdist]
exclude = ["go/bin", "src/gazetteer/_bin"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src/gazetteer", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
pythonpath = ["src", "tests"]
